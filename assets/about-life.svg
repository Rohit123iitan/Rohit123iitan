<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img"><title>About and interests</title><defs><linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#247bff"/><stop offset="1" stop-color="#ff354f"/></linearGradient><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#9db5ff" opacity=".14"/></pattern><style>.bg{fill:#070b16}.t{font-family:Arial,sans-serif;fill:#f4f6ff}.m{font-family:monospace;fill:#aab5ce;letter-spacing:2px}.a{animation:pulse 4s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.65}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.a{animation:none;opacity:1}}</style></defs><rect width="1200" height="520" rx="28" class="bg"/><rect width="1200" height="520" rx="28" fill="url(#dots)"/><rect x="22" y="22" width="1156" height="476" rx="24" fill="none" stroke="url(#edge)" stroke-opacity=".7"/><text x="62" y="82" class="m" font-size="18">01 / ABOUT</text><text x="60" y="150" class="t" font-size="48" font-weight="800">Engineer by craft.</text><text x="60" y="208" font-size="48" font-weight="800" fill="#247bff">Builder by instinct.</text><text x="64" y="258" class="t" font-size="21">I connect backend fundamentals with practical AI systems.</text><rect x="64" y="300" width="500" height="48" rx="12" fill="#111a2d" stroke="#283855"/><text x="84" y="330" class="t" font-size="19">API design & backend systems</text><text x="1110" y="330" class="m" font-size="13" text-anchor="end">REST APIs · Pydantic · SQL</text><rect x="64" y="360" width="500" height="48" rx="12" fill="#111a2d" stroke="#283855"/><text x="84" y="390" class="t" font-size="19">Applied GenAI</text><text x="1110" y="390" class="m" font-size="13" text-anchor="end">RAG · LangChain · LangGraph</text><rect x="64" y="420" width="500" height="48" rx="12" fill="#111a2d" stroke="#283855"/><text x="84" y="450" class="t" font-size="19">Problem solving</text><text x="1110" y="450" class="m" font-size="13" text-anchor="end">DSA · system design · learning</text><text x="660" y="145" class="m" font-size="17">CURRENT CURIOSITIES</text><rect x="650" y="170" width="470" height="260" rx="22" fill="#10182a" stroke="#283855"/><text x="690" y="235" class="t a" font-size="34" font-weight="800">Build. Measure.</text><text x="690" y="280" class="t a" font-size="34" font-weight="800" fill="#247bff">Improve.</text><text x="690" y="332" class="t" font-size="20">Reliable services and grounded</text><text x="690" y="362" class="t" font-size="20">LLM workflows over hype.</text><rect x="690" y="390" width="390" height="5" rx="2" fill="#247bff" class="a"/></svg>