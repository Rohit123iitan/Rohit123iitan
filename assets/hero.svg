<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img"><title>Rohit Kumar — hero</title><defs><linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#247bff"/><stop offset="1" stop-color="#ff354f"/></linearGradient><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#9db5ff" opacity=".14"/></pattern><style>.bg{fill:#070b16}.t{font-family:Arial,sans-serif;fill:#f4f6ff}.m{font-family:monospace;fill:#aab5ce;letter-spacing:2px}.a{animation:pulse 4s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.65}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.a{animation:none;opacity:1}}</style></defs><rect width="1200" height="520" rx="28" class="bg"/><rect width="1200" height="520" rx="28" fill="url(#dots)"/><rect x="22" y="22" width="1156" height="476" rx="24" fill="none" stroke="url(#edge)" stroke-opacity=".7"/><text x="64" y="78" class="m" font-size="18">HELLO, WORLD / ROHIT KUMAR</text><text x="60" y="170" class="t" font-size="70" font-weight="800">I build useful</text><text x="60" y="248" font-size="70" font-weight="800" fill="#247bff">AI systems.</text><text x="64" y="302" class="m" font-size="17">BACKEND · GENAI · RAG · AGENT WORKFLOWS</text><text x="64" y="354" class="t" font-size="24">Python APIs, retrieval pipelines and reliable backend services.</text><rect x="64" y="400" width="250" height="44" rx="22" fill="#111a2d" stroke="#247bff"/><text x="189" y="428" class="t" font-size="18" text-anchor="middle">Bengaluru, India</text><circle cx="930" cy="255" r="145" fill="#247bff" opacity=".12"/><circle cx="930" cy="255" r="115" fill="none" stroke="#ff354f" stroke-width="2" class="a"/><text x="930" y="245" class="t" font-size="30" text-anchor="middle">BUILD</text><text x="930" y="280" class="m" font-size="15" text-anchor="middle">LEARN · SHIP</text></svg>